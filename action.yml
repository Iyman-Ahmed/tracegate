name: "AgentGates CI"
description: "Replay a AgentGates suite against your agent and fail the build when the reliability score drops."
branding:
  icon: "shield"
  color: "orange"
inputs:
  suite:
    description: "Path to the suite TOML file"
    required: true
  runner:
    description: "Runner spec: module:function or file.py:function"
    required: true
  threshold:
    description: "Minimum reliability score (0-1)"
    required: false
    default: ""
  install:
    description: "pip install target for your agent project"
    required: false
    default: "."
  python-version:
    description: "Python version"
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install AgentGates and project
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        pip install "git+https://github.com/Iyman-Ahmed/agentgates"
        pip install "$INSTALL"
      shell: bash
    - name: Run the reliability gate
      env:
        SUITE: ${{ inputs.suite }}
        RUNNER: ${{ inputs.runner }}
        THRESHOLD: ${{ inputs.threshold }}
      run: |
        ARGS=""
        if [ -n "$THRESHOLD" ]; then
          ARGS="--threshold $THRESHOLD"
        fi
        agentgates ci --suite "$SUITE" --runner "$RUNNER" $ARGS
      shell: bash

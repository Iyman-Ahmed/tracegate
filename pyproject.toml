[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgates"
version = "0.1.0"
description = "The black box flight recorder for AI agents - record every step, detect silent failures, gate your deploys."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iyman Ahmed" }]
keywords = ["ai", "agents", "llm", "evaluation", "observability", "reliability", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Iyman-Ahmed/agentgates"
Repository = "https://github.com/Iyman-Ahmed/agentgates"
Issues = "https://github.com/Iyman-Ahmed/agentgates/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
judge = ["anthropic>=0.40"]

[project.scripts]
agentgates = "agentgates.cli:app"

[project.entry-points.pytest11]
agentgates = "agentgates.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
